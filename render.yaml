services:
  - type: web
    name: study-time-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false

  - type: web
    name: study-time-frontend
    env: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
